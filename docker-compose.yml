services:
  api:
    image: ghcr.io/fatiihnaz/inscribed:${INSCRIBED_VERSION:-2}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__Default=Host=db;Port=5432;Database=inscribed_cms;Username=postgres;Password=${DB_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - Auth__Mode=${AUTH_MODE:-BuiltIn}
      - Auth__Audience=${AUTH_AUDIENCE:-inscribed-cms}
      # External mode only; ignored when Auth__Mode is BuiltIn.
      - Auth__Authority=${AUTH_AUTHORITY:-}
      - Auth__TenantClaim=${AUTH_TENANT_CLAIM:-azp}
      - Auth__RolesClaim=${AUTH_ROLES_CLAIM:-roles}
      - Auth__RequireHttpsMetadata=${AUTH_REQUIRE_HTTPS_METADATA:-true}
      # BuiltIn mode only.
      - Auth__Issuer=${AUTH_ISSUER:-http://localhost:5000}
      - Auth__Cookie__Secure=${AUTH_COOKIE_SECURE:-true}
      - Auth__Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Auth__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - Auth__Admin__BootstrapAdmins__0=${BOOTSTRAP_ADMIN_EMAIL:-}
      - Auth__Admin__ConsoleOrigins__0=${ADMIN_CONSOLE_ORIGIN:-http://localhost:3001}
      - Database__MigrateOnStartup=${DB_MIGRATE_ON_STARTUP:-true}
    volumes:
      - ./collections:/app/collections
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Opt-in one-shot for multi-instance deploys: set DB_MIGRATE_ON_STARTUP=false, then
  # `docker compose --profile migrate run --rm api-migrate` before rolling out api replicas.
  api-migrate:
    profiles: ["migrate"]
    image: ghcr.io/fatiihnaz/inscribed:${INSCRIBED_VERSION:-2}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - RUN_MIGRATIONS_AND_EXIT=true
      - ConnectionStrings__Default=Host=db;Port=5432;Database=inscribed_cms;Username=postgres;Password=${DB_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Admin console: `docker compose run --rm admin client list` (run enables the profile
  # on its own). Reaches the database over the compose network, so it works with 5432
  # bound to loopback and before anyone has logged in.
  admin:
    profiles: ["admin"]
    image: ghcr.io/fatiihnaz/inscribed:${INSCRIBED_VERSION:-2}
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["dotnet", "Inscribed.Cli.dll"]
    # Mirrors the api service's auth settings so 'doctor' diagnoses the same
    # configuration the running API sees.
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__Default=Host=db;Port=5432;Database=inscribed_cms;Username=postgres;Password=${DB_PASSWORD}
      - Auth__Mode=${AUTH_MODE:-BuiltIn}
      - Auth__Authority=${AUTH_AUTHORITY:-}
      - Auth__TenantClaim=${AUTH_TENANT_CLAIM:-azp}
      - Auth__RolesClaim=${AUTH_ROLES_CLAIM:-roles}
      - Auth__Issuer=${AUTH_ISSUER:-http://localhost:5000}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inscribed_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only: on a public host an unqualified "5432:5432" would put Postgres
    # on every interface. Kept published so host-side tooling (psql, dotnet ef) works.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inscribed_cms"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
